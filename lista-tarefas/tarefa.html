<html>
    <head>
        <title>Lista de Tarefas</title>
        <style>
            #visor_adicionar{
                width:255px;
            }
            body{
                background: black;
                color: white;
            }
        </style>
    </head>
    <body>
        <input id="visor_adicionar" placeholder="Digite uma Tarefa para adicioná-la à lista:">
        <br>
        <br>
        <button id="adicionar">Adicionar</button>
        <br>
        <br>
        <button id="mostrar">Mostrar tarefas</button>
        <br>
        <br>
        <div id="tela"></div>
        <br>
        <br>
        <div id="tela_erros"></div>
        <script>
            let mostrar = document.getElementById("mostrar");
            let adicionar = document.getElementById("adicionar");
            let visor_adicionar = document.getElementById("visor_adicionar");

            async function mostrarTarefas(){
                let requisicao = await fetch('http://localhost:3500/tarefas');
                let dados = await requisicao.json();
                tela.innerHTML = "";
                
                    dados.forEach(tarefa => {
                        tela.innerHTML += `<p>ID ${tarefa.id}: ${tarefa.titulo} | <button id="deletar-${tarefa.id}">Deletar</button> | <button id="alterar-${tarefa.id}">Alterar</button> </p>`;
                    });
                
                    for (let i = 0; i < dados.length; i++){
                        document.getElementById(`alterar-${dados[i].id}`).onclick = async function(){
                            let tarefa_alterar = visor_adicionar.value;
                        
                            let requisicao = await fetch(`http://localhost:3500/tarefas/${dados[i].id}`, {
                                method: "PUT",
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ titulo: tarefa_alterar})
                            });
                            let texto = await requisicao.text()
                            tela_erros.innerHTML = texto;
                            mostrarTarefas();        
                        }
                        
                            }

                    for (let i = 0; i < dados.length; i++){
                        document.getElementById(`deletar-${dados[i].id}`).onclick = async function(){
                                await fetch(`http://localhost:3500/tarefas/${dados[i].id}`, {
                                method: "DELETE"
                            });
                            mostrarTarefas();
                        };
                        };
                        };
            
            mostrar.onclick = function(){
                mostrarTarefas();
            };
            
            async function adicionarTarefas(){
                let tarefa_texto = visor_adicionar.value;

                let requisicao = await fetch('http://localhost:3500/tarefas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ titulo: tarefa_texto})
                });
                let texto = await requisicao.text();
                tela_erros.innerHTML = texto; 
                mostrarTarefas();
                
            };

            adicionar.onclick = function(){
                adicionarTarefas();
            }
            

        </script>
    </body>
</html>
